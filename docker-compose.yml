x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    @ini_set( 'display_errors', '0' );

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/cafe-child:/var/www/html/wp-content/themes/cafe-child
      - ./wp-content/plugins/cafe-core:/var/www/html/wp-content/plugins/cafe-core

  phpmyadmin:
    image: phpmyadmin:5
    depends_on: [db]
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33" # trùng uid www-data của image wordpress (Debian)
    depends_on: [wordpress]
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/cafe-child:/var/www/html/wp-content/themes/cafe-child
      - ./wp-content/plugins/cafe-core:/var/www/html/wp-content/plugins/cafe-core
      - ./scripts:/scripts:ro
      - ./snapshot:/snapshot

  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app

volumes:
  db_data:
  wp_data:
